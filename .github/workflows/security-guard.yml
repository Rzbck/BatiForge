name: Security Guard

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject forbidden tracked files and large artifacts
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          while IFS= read -r -d '' file; do
            base="$(basename "$file")"

            case "$base" in
              .env|.env.*)
                if [[ "$base" != ".env.example" ]]; then
                  echo "::error file=$file::Environment/secrets file must not be tracked"
                  failed=1
                fi
                ;;
              *.pem|*.key|*.p12|*.pfx|*.jks|*.keystore|id_rsa*|id_ed25519*|credentials.json|service-account*.json|secrets.json)
                echo "::error file=$file::Potential credential/private-key file must not be tracked"
                failed=1
                ;;
            esac

            size=$(stat -c%s "$file")
            if (( size > 10485760 )); then
              echo "::error file=$file::Tracked file exceeds BatiForge 10 MiB source-repository limit ($size bytes)"
              failed=1
            fi
          done < <(git ls-files -z)

          if (( failed != 0 )); then
            exit 1
          fi

      - name: Require immutable GitHub Action pins
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          while IFS= read -r spec; do
            [[ -z "$spec" ]] && continue
            action="${spec#uses:}"
            action="${action# }"

            if [[ "$action" == ./* ]]; then
              continue
            fi

            ref="${action##*@}"
            if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::GitHub Action is not pinned to a full commit SHA: $action"
              failed=1
            fi
          done < <(grep -RhoE 'uses:[[:space:]]*[^[:space:]#]+' .github/workflows || true)

          if grep -RniE 'permissions:[[:space:]]*write-all' .github/workflows; then
            echo "::error::permissions: write-all is forbidden"
            failed=1
          fi

          if (( failed != 0 )); then
            exit 1
          fi

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
